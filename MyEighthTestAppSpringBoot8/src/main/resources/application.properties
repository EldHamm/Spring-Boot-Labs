spring.application.name=MySecurity2DbThemeleaf

# Встроенная база данных H2: файл testdb/students.mv.db создаётся в папке проекта
# (путь считается от рабочего каталога, то есть от корня проекта)
spring.datasource.url=jdbc:h2:./testdb/students
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA и Hibernate: таблицы USERS, ROLES, USERS_ROLES и STUDENTS создаются автоматически при первом запуске,
# а при следующих запусках данные сохраняются (режим update). SQL-запросы выводятся в консоль
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Сообщения приложения (регистрация, вход, ошибки авторизации) выводятся в консоль
logging.level.com.hammatov.MySecurity2DbThemeleaf=INFO
