<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="row">
        <h1 class="text-center">Student Management System</h1>
    </div>

    <p class="text-center text-muted mt-4" sec:authorize="!isAuthenticated()">
        Please <a th:href="@{/login}">log in</a> or <a th:href="@{/register}">register</a> to manage students.
    </p>

    <p class="text-center mt-4" sec:authorize="isAuthenticated()">
        You are signed in as <b sec:authentication="name"></b>.
        <a th:href="@{/list}">Open the list of students</a>
    </p>
</div>

</body>
</html>
