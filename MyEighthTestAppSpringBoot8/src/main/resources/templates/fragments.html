<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Общая навигационная панель. Пункты меню зависят от того, вошёл ли пользователь и есть ли у него роль ROLE_ADMIN -->
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Student Management System</a>

        <ul class="navbar-nav me-auto">
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/register}">Register</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/list}">Students</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/users}">Users</a>
            </li>
        </ul>

        <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
            Signed in as <span sec:authentication="name"></span>
        </span>
        <a class="btn btn-outline-light btn-sm" sec:authorize="isAuthenticated()" th:href="@{/logout}">Logout</a>
    </div>
</nav>

</body>
</html>
