server.port=8082
spring.application.name=MySecondTestAppSpringBoot

# Уровни логирования (все логи выводятся в консоль):
# сообщения самого Spring показываем только при ошибках, а свои сообщения приложения до уровня DEBUG
logging.level.org.springframework=ERROR
logging.level.com.hammatov=DEBUG

# Пересылать ли request на Сервис 2 (порт 8084) из ЛР4.
# Поставьте false, чтобы запускать этот сервис без Сервиса 2
service2.forwarding.enabled=true
