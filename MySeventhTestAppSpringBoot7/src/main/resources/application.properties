spring.application.name=MyUiRestDbService

# Встроенная база данных H2: файл testdb/students.mv.db создаётся в папке проекта
# (путь считается от рабочего каталога, то есть от корня проекта)
spring.datasource.url=jdbc:h2:./testdb/students
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA и Hibernate: таблицы STUDENTS и ACADEMIC_GROUPS создаются автоматически, SQL выводится в консоль
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Веб-консоль H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Boot Actuator: какие endpoint'ы доступны по адресу http://localhost:8080/actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers,configprops
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Данные для endpoint /actuator/info
info.app.name=MyUiRestDbService
info.app.description=Web application with Thymeleaf forms, H2 database and Actuator
info.app.author=Hammatov

# Сообщения приложения (log.info) выводятся в консоль
logging.level.com.hammatov.MyUiRestDbService=INFO
