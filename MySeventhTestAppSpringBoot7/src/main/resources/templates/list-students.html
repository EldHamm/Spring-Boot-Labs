<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.7/css/dataTables.bootstrap5.min.css">
</head>

<body>

<nav th:replace="~{fragments :: navbar('students')}"></nav>

<div class="container">

    <h3>List Students</h3>
    <hr/>

    <a th:href="@{/addStudentForm}" class="btn btn-primary">Add Student</a>
    <br/><br/>

    <table class="table table-bordered table-striped" id="studentTable">
        <thead>
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Faculty</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}"></td>
            <td th:text="${student.surname}"></td>
            <td th:text="${student.faculty}"></td>
            <td th:text="${student.age}"></td>
            <td>
                <a th:href="@{/showUpdateForm(id=${student.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/deleteStudent(id=${student.id})}" class="btn btn-danger btn-sm ms-2"
                   onclick="return confirm('Delete this student?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.7/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.0.7/js/dataTables.bootstrap5.min.js"></script>
<script>
    $(document).ready(function () {
        $('#studentTable').DataTable({
            // Последний столбец (кнопки Update и Delete) нельзя сортировать и искать по нему
            columnDefs: [{orderable: false, searchable: false, targets: -1}]
        });
    });
</script>
</body>

</html>
