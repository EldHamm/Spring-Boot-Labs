<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>

<nav th:replace="~{fragments :: navbar('students')}"></nav>

<div class="container">

    <!-- Эта же форма открывается и для добавления, и для редактирования студента -->
    <h3 th:text="${student.id == null} ? 'Add New Student' : 'Update Student'">Add New Student</h3>
    <hr/>

    <form th:action="@{/saveStudent}" th:object="${student}" method="POST">

        <div class="mb-3 col-md-5">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   placeholder="Enter Name" maxlength="15" required/>
        </div>

        <div class="mb-3 col-md-5">
            <label for="surname" class="form-label">Surname</label>
            <input type="text" id="surname" th:field="*{surname}" class="form-control"
                   placeholder="Enter Surname" maxlength="25" required/>
        </div>

        <div class="mb-3 col-md-5">
            <label for="faculty" class="form-label">Faculty</label>
            <input type="text" id="faculty" th:field="*{faculty}" class="form-control"
                   placeholder="Enter Faculty" maxlength="20" required/>
        </div>

        <div class="mb-4 col-md-5">
            <label for="age" class="form-label">Age</label>
            <input type="number" id="age" th:field="*{age}" class="form-control"
                   placeholder="Enter Age" min="1" max="120" required/>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>

        <input type="hidden" th:field="*{id}"/>

    </form>
    <hr/>
    <a th:href="@{/list}">Back to list</a>
</div>

</body>
</html>
