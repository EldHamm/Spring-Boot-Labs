<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List Academic Groups</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.7/css/dataTables.bootstrap5.min.css">
</head>

<body>

<nav th:replace="~{fragments :: navbar('groups')}"></nav>

<div class="container">

    <h3>List Academic Groups</h3>
    <hr/>

    <a th:href="@{/addGroupForm}" class="btn btn-primary">Add Academic Group</a>
    <br/><br/>

    <table class="table table-bordered table-striped" id="groupTable">
        <thead>
        <tr>
            <th>Name</th>
            <th>Component count</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="group : ${academicGroups}">
            <td th:text="${group.name}"></td>
            <td th:text="${group.componentCount}"></td>
            <td>
                <a th:href="@{/showGroupUpdateForm(id=${group.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/deleteGroup(id=${group.id})}" class="btn btn-danger btn-sm ms-2"
                   onclick="return confirm('Delete this academic group?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.7/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.0.7/js/dataTables.bootstrap5.min.js"></script>
<script>
    $(document).ready(function () {
        $('#groupTable').DataTable({
            // Последний столбец (кнопки Update и Delete) нельзя сортировать и искать по нему
            columnDefs: [{orderable: false, searchable: false, targets: -1}]
        });
    });
</script>
</body>

</html>
