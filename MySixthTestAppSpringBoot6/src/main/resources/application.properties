spring.application.name=MySpringBoot2Dbase

# Встроенная база данных H2: файл testdb/students.mv.db создаётся в папке проекта
# (путь считается от рабочего каталога, то есть от корня проекта)
spring.datasource.url=jdbc:h2:./testdb/students
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA и Hibernate: таблицы STUDENTS и SUBJECTS создаются автоматически, SQL-запросы выводятся в консоль
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Веб-консоль H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Красивый JSON с отступами в ответах
spring.jackson.serialization.indent-output=true

# Сообщения приложения (log.info) выводятся в консоль
logging.level.com.hammatov.MySpringBoot2Dbase=INFO
